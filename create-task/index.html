<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Task</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <h1 class="task-heading">Task creation</h1>
      <form class="task-form" id="taskForm">
        <section class="form-panel" aria-label="Create task details">
          <div class="field field-title">
            <label for="taskTitle">Task Title:</label>
            <input id="taskTitle" name="taskTitle" type="text" required />
          </div>

          <div class="middle-row">
            <div class="field field-description">
              <label for="taskDescription">Task Description:</label>
              <textarea id="taskDescription" name="taskDescription" required></textarea>
            </div>

            <div class="date-field">
              <label for="taskDueDate">Due Date:</label>
              <span class="calendar-control">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="16" rx="1" />
                  <path d="M7 3v4M17 3v4M3 10h18" />
                </svg>
                <input id="taskDueDate" name="taskDueDate" type="date" required aria-label="Task due date" />
              </span>
            </div>
          </div>

          <div class="field field-other">
            <label for="otherInfo">Other Task Information:</label>
            <textarea id="otherInfo" name="otherInfo"></textarea>
          </div>
        </section>

        <button class="submit-button" type="submit">CREATE TASK</button>
      </form>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
