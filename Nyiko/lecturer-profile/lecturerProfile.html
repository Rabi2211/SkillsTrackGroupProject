<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Menu</title>
    <link rel="stylesheet" href="lecturerProfile.css" />
  </head>
  <body>
    <main class="profile-page">
      <button class="close-button" type="button" aria-label="Close profile">X</button>

      <section class="profile-header" aria-label="Profile details">
        <div class="avatar" aria-hidden="true">
          <span class="avatar-head"></span>
          <span class="avatar-shoulders"></span>
        </div>

        <div class="identity">
          <p>[Name and Surname]</p>
          <p>[Username(email)]</p>
        </div>
      </section>

      <nav class="menu-card" aria-label="Profile menu">
        <a href="../profile/index.html">Edit profile</a>
        <button type="button" id="settingsButton">Settings</button>
        <button type="button">Sign out</button>
      </nav>

      <div id="settingsPopup" hidden style="position: fixed; inset: 0; background: rgba(0,0,0,0.2); display: grid; place-items: center; z-index: 20;">
        <div style="background: white; border-radius: 12px; padding: 20px 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); min-width: 220px; text-align: center; position: relative;">
          <button type="button" id="closePopupButton" aria-label="Close settings popup" style="position: absolute; top: 8px; right: 10px; border: none; background: transparent; font-size: 20px; cursor: pointer; color: #1f2937;">X</button>
          <button type="button" id="resetPasswordButton" style="padding: 10px 16px; border: none; border-radius: 8px; background: #d7b98a; color: #1f2937; cursor: pointer; font-weight: 600; margin-top: 18px;">
            Reset Password
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="lecturerProfile.js"></script>
  </body>
</html>
