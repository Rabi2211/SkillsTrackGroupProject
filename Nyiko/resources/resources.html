<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resources</title>
    <link rel="stylesheet" href="resources.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" style="position: relative;">
        <img class="brand-logo" src="/images/logo.png" alt="SkillsTrack logo" />

        <div style="position: relative;">
          <button
            class="menu-button"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            onclick="const popup = document.getElementById('menuPopup'); const isHidden = popup.hidden; popup.hidden = !isHidden; this.setAttribute('aria-expanded', String(isHidden));"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div
            id="menuPopup"
            hidden
            style="position: absolute; right: 0; top: 52px; background: white; border-radius: 10px; box-shadow: 0 8px 18px rgba(0,0,0,0.15); padding: 8px; min-width: 130px; z-index: 20;"
          >
            <button type="button" onclick="window.location.href='../../src/pages/lecturerPortal.html'" style="display: flex; align-items: center; justify-content: center; width: 100%; border: none; background: transparent; color: #1f2937; font-size: 16px; padding: 10px 12px; border-radius: 8px; cursor: pointer;">
              👤 Profile
            </button>
            <button type="button" onclick="window.location.href='../../Nyiko/search-learner/searchLearner.html';" style="display: flex; align-items: center; justify-content: center; width: 100%; border: none; background: transparent; color: #1f2937; font-size: 16px; padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-top: 4px;">
              Search Learner
            </button>
            <button type="button" onclick="window.location.href='../../Nyiko/schedule-support/scheduleSupport.html';" style="display: flex; align-items: center; justify-content: center; width: 100%; border: none; background: transparent; color: #1f2937; font-size: 16px; padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-top: 4px;">
              Schedule Session
            </button>
          </div>
        </div>
      </header>

      <main class="content">
        <h1>Welcome To Resources</h1>

        <div class="upload-panel">
          <div class="upload-box">
            <div class="upload-title">Upload PDF</div>
            <button class="upload-icon" type="button" aria-label="Choose PDF file">
              <span></span>
            </button>
          </div>

          <p class="selected-file" id="selected-file-name">No PDF selected</p>
          <button class="upload-button" type="button">UPLOAD</button>
        </div>
      </main>
    </div>

    <script type="module" src="resources.js"></script>
  </body>
</html>
