<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resources</title>
    <link rel="stylesheet" href="resources.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <img class="brand-logo" src="../images/logo.png" alt="SkillsTrack logo" />

        <button class="menu-button" type="button" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </header>

      <main class="content">
        <h1>Welcome To Resources</h1>

        <div class="upload-panel">
          <div class="upload-box">
            <div class="upload-title">Upload PDF</div>
            <button class="upload-icon" type="button" aria-label="Choose PDF file">
              <span></span>
            </button>
          </div>

          <p class="selected-file" id="selected-file-name">No PDF selected</p>
          <button class="upload-button" type="button">UPLOAD</button>
        </div>
      </main>
    </div>

    <script type="module" src="resources.js"></script>
  </body>
</html>
