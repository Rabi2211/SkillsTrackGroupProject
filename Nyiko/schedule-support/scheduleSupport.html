<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Support</title>
    <link rel="stylesheet" href="scheduleSupport.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="support-panel" aria-label="Schedule support">

        <h1>Schedule Support</h1>

        <div class="table-wrap">
          <div class="table-header row">
            <div class="cell date">Date:</div>
            <div class="cell time">Time:</div>
            <div class="cell name">Name:</div>
            <div class="cell action">Schedule</div>
          </div>
          <div id="scheduleRows"></div>
        </div>
      </section>
    </main>
    <script type="module" src="scheduleSupport.js"></script>
  </body>
</html>
