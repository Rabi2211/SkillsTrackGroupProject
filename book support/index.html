<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Support | SkillsTrack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <button class="back-button" id="backButton" type="button" aria-label="Go back">&lt;</button>

    <section class="booking-panel" aria-labelledby="pageTitle">
      <h1 id="pageTitle" class="sr-only">Book Support</h1>
      <form id="bookingForm">
        <label class="field topic-field" for="topic">Topic Of Booking:
          <input id="topic" name="topic" type="text" required>
        </label>

        <label class="date-field" for="dueDate">Due Date:
          <input id="dueDate" name="dueDate" type="date" required>
        </label>

        <label class="field description-field" for="description">Topic Description:
          <textarea id="description" name="description" required></textarea>
        </label>

        <button class="book-button" type="submit">BOOK SESSION</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
