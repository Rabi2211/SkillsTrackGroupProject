<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillsTrack | Memory Challenge</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        padding: 20px 4%;
        color: #e7edf6;
        background: #030713 url("../public/images/background.png") center / cover fixed no-repeat;
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-shell {
        min-height: calc(100vh - 40px);
        overflow: hidden;
        background: rgba(2, 9, 24, 0.2);
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 46px;
        margin: 0 auto 5px;
        padding: 0 16px;
        background: rgba(17, 34, 58, 0.88);
      }

      .brand img {
        display: block;
        width: 30px;
        height: 30px;
        object-fit: contain;
      }

      .profile {
        display: grid;
        width: 20px;
        height: 20px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 50%;
        color: #41516d;
        background: #eee8ff;
      }

      .profile svg {
        width: 12px;
        height: 12px;
      }

      .site-nav {
        display: flex;
        justify-content: space-around;
        width: min(76%, 720px);
        min-height: 25px;
        margin: 0 auto;
        background: rgba(17, 34, 58, 0.84);
      }

      .site-nav a {
        display: grid;
        padding: 0 12px;
        place-items: center;
        color: rgba(231, 237, 246, 0.82);
        font-size: 7px;
        text-decoration: none;
      }

      .site-nav a:hover,
      .site-nav a:focus-visible {
        color: #fff;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      main {
        padding: 0 3.5% 24px;
      }

      h1 {
        margin: 19px 0 29px;
        color: rgba(238, 240, 246, 0.84);
        font-size: clamp(18px, 2.6vw, 22px);
        font-weight: 400;
        text-align: center;
      }

      .game-label {
        margin: 0 0 0 1%;
        color: rgba(230, 232, 241, 0.58);
        font-size: 15px;
        font-weight: 400;
      }

      .play-area {
        display: grid;
        min-height: 270px;
        place-items: center;
        padding: 0 12px 18px;
        background: rgba(1, 7, 20, 0.2);
      }

      .game-panel {
        width: min(100%, 180px);
        padding: 7px 15px 8px;
        border-radius: 20px;
        background: #243d62;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
        text-align: center;
      }

      .game-panel h2 {
        margin: 0;
        color: #f2f4f8;
        font-size: 14px;
        font-weight: 400;
      }

      .instructions {
        margin: 2px 0 8px;
        color: rgba(228, 236, 247, 0.8);
        font-size: 5px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        margin-bottom: 10px;
      }

      .stat {
        min-height: 24px;
        padding: 3px 2px 2px;
        border-radius: 3px;
        color: #e7edf6;
        background: #31517d;
      }

      .stat-label {
        display: block;
        margin-bottom: 1px;
        font-size: 6px;
      }

      .stat-value {
        display: block;
        font-size: 9px;
      }

      .memory-board {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 5px;
      }

      .memory-button {
        aspect-ratio: 1.55;
        min-width: 0;
        border: 0;
        border-radius: 5px;
        opacity: 0.92;
        cursor: pointer;
        transition: filter 120ms ease, transform 120ms ease, opacity 120ms ease;
      }

      .memory-button:disabled {
        cursor: default;
      }

      .memory-button:not(:disabled):hover {
        filter: brightness(1.13);
      }

      .memory-button:focus-visible,
      .action-button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }

      .memory-button.active {
        filter: brightness(1.65);
        opacity: 1;
        transform: scale(0.96);
      }

      #green {
        background: #24b45a;
      }

      #red {
        background: #e94749;
      }

      #yellow {
        background: #edc326;
      }

      #blue {
        background: #3384d8;
      }

      .status {
        min-height: 17px;
        margin: 6px 0 2px;
        color: rgba(233, 239, 249, 0.9);
        font-size: 9px;
      }

      .game-over {
        margin-top: 2px;
        padding: 4px 5px 3px;
        border-radius: 4px;
        color: #e4ebf6;
        background: #2d4a72;
      }

      .game-over h3 {
        margin: 0 0 4px;
        font-size: 9px;
        font-weight: 400;
      }

      .game-over p {
        margin: 0 0 4px;
        font-size: 7px;
      }

      .action-button {
        min-height: 16px;
        padding: 2px 7px;
        border: 0;
        border-radius: 3px;
        color: #263854;
        background: #e7e9ee;
        font-size: 6px;
        cursor: pointer;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 520px) {
        body {
          padding: 10px;
          background-attachment: scroll;
        }

        .game-shell {
          min-height: calc(100vh - 20px);
        }

        .site-nav {
          width: 100%;
        }

        main {
          padding: 0 4% 18px;
        }

        h1 {
          margin: 24px 0 27px;
        }

        .play-area {
          min-height: 300px;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <header class="site-header">
        <a class="brand" href="../src/pages/learner-portal.html" aria-label="SkillsTrack dashboard">
          <img src="../public/images/logo.png" alt="SkillsTrack" />
        </a>
        <a class="profile" href="../src/pages/profile.html" aria-label="Profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z" />
          </svg>
        </a>
      </header>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="../src/pages/learner-portal.html">Dashboard</a>
        <a href="../src/pages/tasks.html">Tasks</a>
        <a href="#">Bookings</a>
        <a href="#">Resources</a>
      </nav>

      <main>
        <h1>Welcome To GAME Center</h1>
        <h2 class="game-label">GAME</h2>

        <section class="play-area" aria-label="Memory challenge game">
          <div class="game-panel">
            <h2>Memory Challenge</h2>
            <p class="instructions">Watch the sequence carefully and repeat it in the correct order.</p>

            <div class="stats" aria-label="Game statistics">
              <div class="stat"><span class="stat-label">LEVEL</span><strong class="stat-value" id="level">0</strong></div>
              <div class="stat"><span class="stat-label">SCORE</span><strong class="stat-value" id="score">0</strong></div>
              <div class="stat"><span class="stat-label">BEST</span><strong class="stat-value" id="high-score">0</strong></div>
            </div>

            <div class="memory-board" aria-label="Sequence buttons">
              <button class="memory-button" id="green" data-color="green" type="button" aria-label="Green" disabled></button>
              <button class="memory-button" id="red" data-color="red" type="button" aria-label="Red" disabled></button>
              <button class="memory-button" id="yellow" data-color="yellow" type="button" aria-label="Yellow" disabled></button>
              <button class="memory-button" id="blue" data-color="blue" type="button" aria-label="Blue" disabled></button>
            </div>

            <p class="status" id="status" aria-live="polite">Press Start to begin.</p>
            <button class="action-button" id="start-button" type="button">Start game</button>

            <div class="game-over hidden" id="game-over" aria-live="polite">
              <h3>Game over</h3>
              <p>Your final score: <strong id="final-score">0</strong></p>
              <button class="action-button" id="restart-button" type="button">Play again</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./game.js"></script>
  </body>
</html>
