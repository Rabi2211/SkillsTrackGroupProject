<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Learner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-frame">
      <header class="page-header">
        <button class="back-button" type="button" aria-label="Go back">&lt;</button>
        <h1>Search Learner</h1>
      </header>

      <form class="search-row" role="search">
        <label for="learnerSearch">Search</label>
        <input id="learnerSearch" name="learnerSearch" type="search" placeholder="learner" />
      </form>

      <section class="results-frame" aria-label="Learner search results">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">Learner Name</th>
                <th scope="col">Tasks</th>
                <th scope="col">Progress</th>
                <th scope="col">Bookings</th>
                <th scope="col">Tasks Completed</th>
              </tr>
            </thead>
            <tbody id="learnerResults"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
