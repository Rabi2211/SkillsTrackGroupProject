<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Support</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header>
      <h1>Schedule Support</h1>
    </header>
    <section id="requests" aria-label="Support booking requests"></section>
    <p id="emptyState" class="empty" hidden>No support requests are waiting to be scheduled.</p>
  </main>

  <dialog id="scheduleDialog">
    <form id="scheduleForm">
      <button class="close" type="button" id="closeDialog" aria-label="Close">&times;</button>
      <p class="eyebrow">Book support</p>
      <h2>Schedule a session</h2>
      <p id="selectedRequest"></p>
      <label for="date">Date</label>
      <input id="date" type="date" required>
      <label for="time">Time</label>
      <input id="time" type="time" required>
      <div class="actions">
        <button type="button" class="cancel" id="cancelDialog">Cancel</button>
        <button type="submit" class="confirm">Confirm schedule</button>
      </div>
    </form>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
