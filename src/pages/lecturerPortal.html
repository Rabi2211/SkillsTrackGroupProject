<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lecturer Portal</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>

  <body>
    <main class="desktop-7 lecturer-portal">
      <header class="header">
        <a href="lecturerPortal.html" aria-label="Back to lecturer dashboard">
          <img class="logo" src="../../public/images/logo.png" alt="SkillsTrack logo" />
        </a>

        <div style="position: relative;">
          <button
            class="menu-button"
            aria-label="Open menu"
            aria-expanded="false"
            onclick="const popup = document.getElementById('menuPopup'); const isHidden = popup.hidden; popup.hidden = !isHidden; this.setAttribute('aria-expanded', String(isHidden));"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div
            id="menuPopup"
            hidden
            style="position: absolute; right: 0; top: 52px; background: white; border-radius: 10px; box-shadow: 0 8px 18px rgba(0,0,0,0.15); padding: 8px; min-width: 130px; z-index: 20;"
          >
            <button type="button" onclick="window.location.href='../../Nyiko/lecturer-profile/lecturerProfile.html'" style="display: flex; align-items: center; justify-content: center; width: 100%; border: none; background: transparent; color: #1f2937; font-size: 16px; padding: 10px 12px; border-radius: 8px; cursor: pointer;">
              👤 Profile
            </button>
            <button type="button" onclick="window.location.href='../../Nyiko/search-learner/searchLearner.html';" style="display: flex; align-items: center; justify-content: center; width: 100%; border: none; background: transparent; color: #1f2937; font-size: 16px; padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-top: 4px;">
              Search Learner
            </button>
            <button type="button" onclick="window.location.href='../../Nyiko/schedule-support/scheduleSupport.html';" style="display: flex; align-items: center; justify-content: center; width: 100%; border: none; background: transparent; color: #1f2937; font-size: 16px; padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-top: 4px;">
              Schedule Session
            </button>
          </div>
        </div>
      </header>

      <h1 class="portal-title">Welcome To Lecturer Portal</h1>

      <div class="lecturer-layout">
        <div class="left-column">
          <section class="actions-card" aria-label="Add task actions">
            <article class="action">
              <h2>Add Tasks</h2>
              <p>Fill form to add tasks</p>
              <button type="button" aria-label="Add task" onclick="window.location.href='../../Nyiko/create-task/createTask.html'">+</button>
            </article>

            <div class="divider" aria-hidden="true"></div>

            <article class="action">
              <h2>Add Guide</h2>
              <p>Upload a pdf file of guide</p>
              <button type="button" aria-label="Upload guide" onclick="window.location.href='../../Nyiko/resources/resources.html'">+</button>
            </article>
          </section>

          <section class="report-card" aria-label="Download learner report">
            <h2>Download learners report</h2>
            <button type="button" onclick="window.location.href='lecturerReport.html'">Print</button>
          </section>
        </div>

        <section class="progress-card" aria-label="Learner progress overview">
          <h2>Learner's Progress</h2>

          <div class="overall">
            <div class="progress-ring large-ring" style="background: conic-gradient(#4f46e5 0 72%, #f3f4f6 72% 100%);">
              <strong>72%</strong>
            </div>
            <p>OverAll</p>
          </div>

          <div class="progress-groups">
            <div class="progress-item">
              <div class="progress-ring small-ring" style="background: conic-gradient(#4f46e5 0 84%, #f3f4f6 84% 100%);">
                <strong>84%</strong>
              </div>
              <p>Female Learners</p>
            </div>

            <div class="progress-item">
              <div class="progress-ring small-ring" style="background: conic-gradient(#4f46e5 0 91%, #f3f4f6 91% 100%);">
                <strong>91%</strong>
              </div>
              <p>Male Learners</p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script type="module">
      import { ref, onValue } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";
      import { db, snapshotToList } from "../../firebase.js";

      function updateRing(ring, label, percent) {
        if (!ring) return;
        const safePercent = Math.max(0, Math.min(100, Number(percent) || 0));

        if (label) label.textContent = `${safePercent}%`;
        ring.style.background = `conic-gradient(#4f46e5 0 ${safePercent}%, #f3f4f6 ${safePercent}% 100%)`;
      }

      function average(values) {
        if (!values.length) return 0;
        return values.reduce((sum, value) => sum + value, 0) / values.length;
      }

      function normalizeLearnerIds(task) {
        const values = [];
        const raw = task?.assignedTo;

        if (Array.isArray(raw)) {
          raw.forEach((id) => id && values.push(String(id)));
        } else if (raw) {
          values.push(String(raw));
        }

        if (task?.userId) values.push(String(task.userId));
        if (task?.learnerId) values.push(String(task.learnerId));

        return [...new Set(values.filter(Boolean))];
      }

      function getStatusValue(task) {
        return String(task?.status || '').trim().toLowerCase();
      }

      function getStudentGender(student) {
        const gender = String(student?.gender || '').trim().toLowerCase();
        if (gender.includes('female')) return 'female';
        if (gender.includes('male')) return 'male';
        return '';
      }

      function computeProgressForLearner(learnerId, tasks) {
        const learnerTasks = tasks.filter((task) => normalizeLearnerIds(task).includes(String(learnerId)));
        if (!learnerTasks.length) return 0;

        const completed = learnerTasks.filter((task) => {
          const status = getStatusValue(task);
          return status === 'complete' || status === 'completed';
        }).length;

        return (completed / learnerTasks.length) * 100;
      }

      let tasksSnapshot = null;
      let studentsSnapshot = null;

      function renderProgressSummary() {
        if (!tasksSnapshot || !studentsSnapshot) return;

        const taskList = snapshotToList(tasksSnapshot);
        const studentList = snapshotToList(studentsSnapshot);

        const learnerIds = [...new Set(taskList.flatMap((task) => normalizeLearnerIds(task)))];
        const learnerProgress = learnerIds.map((learnerId) => computeProgressForLearner(learnerId, taskList));

        const overallPercent = average(learnerProgress);

        const femaleIds = studentList
          .filter((student) => getStudentGender(student) === 'female')
          .map((student) => String(student.uid || student.id || student.userId || ''))
          .filter(Boolean);

        const maleIds = studentList
          .filter((student) => getStudentGender(student) === 'male')
          .map((student) => String(student.uid || student.id || student.userId || ''))
          .filter(Boolean);

        const femaleProgress = average(femaleIds.map((learnerId) => computeProgressForLearner(learnerId, taskList)));
        const maleProgress = average(maleIds.map((learnerId) => computeProgressForLearner(learnerId, taskList)));

        const overallRing = document.querySelector('.large-ring');
        const overallLabel = overallRing ? overallRing.querySelector('strong') : null;
        updateRing(overallRing, overallLabel, overallPercent);

        const femaleRing = document.querySelectorAll('.small-ring')[0];
        const femaleLabel = femaleRing ? femaleRing.querySelector('strong') : null;
        updateRing(femaleRing, femaleLabel, femaleProgress);

        const maleRing = document.querySelectorAll('.small-ring')[1];
        const maleLabel = maleRing ? maleRing.querySelector('strong') : null;
        updateRing(maleRing, maleLabel, maleProgress);
      }

      const tasksRef = ref(db, 'tasks');
      const studentsRef = ref(db, 'students');

      const tasksUnsub = onValue(tasksRef, (snapshot) => {
        tasksSnapshot = snapshot;
        renderProgressSummary();
      }, (error) => {
        console.error('Failed to read tasks for lecturer progress:', error);
      });

      const studentsUnsub = onValue(studentsRef, (snapshot) => {
        studentsSnapshot = snapshot;
        renderProgressSummary();
      }, (error) => {
        console.error('Failed to read students for lecturer progress:', error);
      });

      window.addEventListener('beforeunload', () => {
        try { tasksUnsub(); } catch (_) {}
        try { studentsUnsub(); } catch (_) {}
      });
    </script>
  </body>
</html>
