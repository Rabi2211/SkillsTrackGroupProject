<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillsTrack — Landing</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <div class="st-landing">
      <canvas id="bg" class="bg-canvas" aria-hidden="true"></canvas>
      <div class="st-frame">
        <img src="../../public/images/logo.png" class="st-logo" alt="SkillsTrack logo" width="140" height="140" />
        <h1 class="st-welcome">Welcome To SkillsTrack</h1>
        <p class="st-subtitle">Please choose role</p>
        <canvas id="word-canvas" class="word-canvas" aria-hidden="true"></canvas>
        <div class="st-roles">
          <button type="button" class="st-role-btn" id="lecturerBtn">Lecturer</button>
          <button type="button" class="st-role-btn" id="learnerBtn">Learner</button>
        </div>
      </div>
    </div>

    <script src="../../scripts/landing.js"></script>
    <script src="../../scripts/fit.js"></script>
  </body>
</html>
