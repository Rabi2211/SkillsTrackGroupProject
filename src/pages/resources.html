<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillsTrack — Resources</title>
    <style>
      :root {
        --bg-deep: #030d1d;
        --frame: #000000;
        --nav-bg: rgba(11, 23, 35, 0.8);
        --nav-inner: rgba(255, 255, 255, 0.03);
        --card: rgba(220, 220, 220, 0.76);
        --card-strong: rgba(200, 200, 200, 0.8);
        --text: rgba(245, 247, 255, 0.96);
        --muted: rgba(245, 247, 255, 0.68);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg-deep);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 25%, rgba(140, 167, 223, 0.2), transparent 25%),
          radial-gradient(circle at 18% 28%, rgba(108, 104, 201, 0.18), transparent 22%),
          radial-gradient(circle at 70% 35%, rgba(102, 140, 205, 0.18), transparent 24%),
          url("../../public/images/background.png") center/cover no-repeat;
        padding: 20px 0 30px;
      }

      .resources-shell {
        width: min(1200px, calc(100% - 32px));
        border: 3px solid var(--frame);
        background: rgba(0, 0, 0, 0.18);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      }

      .resources-header {
        width: 100%;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 20px 0 16px;
        background: rgba(10, 24, 39, 0.84);
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      .resources-brand {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .resources-brand img {
        width: 34px;
        height: 34px;
        object-fit: contain;
        display: block;
      }

      .resources-nav {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(22px, 3vw, 54px);
        height: 52px;
        background: rgba(255, 255, 255, 0.02);
      }

      .resources-nav a {
        text-decoration: none;
        color: rgba(255,255,255,0.82);
        font-size: 15px;
        line-height: 1;
        letter-spacing: 0.01em;
        font-weight: 500;
      }

      .resources-nav a.active {
        color: #ffffff;
      }

      .resources-profile {
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        display: grid;
        place-items: center;
        color: #0d1d33;
        box-shadow: 0 8px 14px rgba(0,0,0,0.18);
        padding: 0;
      }

      .resources-profile svg {
        width: 18px;
        height: 18px;
      }

      .resources-main {
        padding: 28px 0 20px;
      }

      .resources-title {
        margin: 0 auto 28px;
        text-align: center;
        font-size: clamp(2.3rem, 3vw, 4rem);
        line-height: 1.12;
        font-weight: 400;
        letter-spacing: 0.01em;
        color: rgba(241, 245, 255, 0.96);
      }

      .resources-grid {
        width: min(780px, calc(100% - 70px));
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 28px 34px;
        justify-content: center;
      }

      .resource-item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .resource-card {
        width: 100%;
        max-width: 220px;
        aspect-ratio: 1.15;
        background: rgba(224, 224, 224, 0.76);
        border: 0;
        display: grid;
        place-items: center;
        color: rgba(16, 24, 35, 0.9);
        font-size: clamp(2rem, 2vw, 3rem);
        font-weight: 500;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
      }

      .resource-button {
        margin-top: 16px;
        padding: 8px 16px;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(255,255,255,0.05);
        color: rgba(245,247,255,0.92);
        font-size: 0.7rem;
        line-height: 1;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border-radius: 3px;
        cursor: pointer;
      }

      @media (max-width: 760px) {
        .resources-grid {
          grid-template-columns: 1fr;
          width: min(280px, calc(100% - 30px));
        }

        .resources-header {
          padding: 0 10px;
        }

        .resources-nav {
          gap: 12px;
          overflow-x: auto;
          justify-content: flex-start;
          padding: 0 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="resources-shell">
      <header class="resources-header">
        <div class="resources-brand" aria-label="SkillsTrack logo">
          <img src="../../public/images/logo.png" alt="SkillsTrack logo" />
        </div>

        <nav class="resources-nav" aria-label="Main navigation">
          <a href="#">Dashboard</a>
          <a href="#">Tasks</a>
          <a href="#">Bookings</a>
          <a href="#" class="active">Resources</a>
        </nav>

        <button type="button" class="resources-profile" aria-label="Profile">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-3.87 0-7 2.24-7 5v1h14v-1c0-2.76-3.13-5-7-5Z" fill="currentColor"/>
          </svg>
        </button>
      </header>

      <main class="resources-main">
        <h1 class="resources-title">Welcome To RESOURCES:</h1>

        <section class="resources-grid" aria-label="Resource downloads">
          <div class="resource-item">
            <div class="resource-card" aria-label="PDF resource">PDF</div>
            <button type="button" class="resource-button">Download</button>
          </div>

          <div class="resource-item">
            <div class="resource-card" aria-label="PDF resource">PDF</div>
            <button type="button" class="resource-button">Download</button>
          </div>

          <div class="resource-item">
            <div class="resource-card" aria-label="PDF resource">PDF</div>
            <button type="button" class="resource-button">Download</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
