<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Administration Account</title>
    <link rel="stylesheet" href="createLearnerAccount.css">
</head>

<body>

    <div class="container">

        <span class="close-btn" onclick="closeForm()">✕</span>

        <h2>Create Administration Account</h2>

        <form id="accountForm">

            <div class="form-group">
                <label for="name">Name & Surname</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter name and surname"
                    required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select gender</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                    <option value="Other">Other</option>
                    <option value="Prefer not to say">Prefer not to say</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>

                <small>
                    Password must contain at least one special character
                    (!@#$%^&*).
                </small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Retype Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Retype password"
                    required>
            </div>

            <button type="submit">Create Account</button>

            <p id="message"></p>

        </form>

    </div>

    <script src="../../scripts/password-toggle.js"></script>
    <script type="module" src="createLearnerAccount.js"></script>
</body>
</html>
